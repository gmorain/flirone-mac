[project]
name = "flirone-mac"
version = "0.1.0"
description = "macOS viewer and radiometric measurement tool for the FLIR One thermal camera"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyusb>=1.2.1",
    "PySide6>=6.6",
    "pillow>=10.0",
    "tifffile>=2024.1.30",
]

[project.optional-dependencies]
geo = ["rasterio>=1.3"]

[project.scripts]
flirone = "flirone.ui.app:main"
flirone-probe = "flirone.probe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flirone"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Hardware probes are kept as evidence, not maintained as code.
exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
